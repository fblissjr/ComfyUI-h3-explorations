<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniMax H3 Control Vector Studio</title>
<link rel="stylesheet" href="/ui/style.css" />
</head>
<!--
  The shell only. Every control on this page is drawn by web/form.js from GET /api/schema, which
  is the CLI's own parser walked (bench/control_vector/ui_schema.py). No argument, choice or
  default is written here or in the scripts: add a flag to the CLI and it is on the page.
  bench/check_control_vector_studio.py fails if a hand-written option list comes back.
-->
<body>
<div class="app-shell">
  <header class="top-header">
    <div class="brand">
      <span class="brand-badge">H3 Studio</span>
      <h1>MiniMax H3 Control Vector Studio</h1>
      <span class="brand-sub">The control vector command line, as a page</span>
    </div>
    <div class="header-controls">
      <div id="status-indicator" class="status-pill">Connecting...</div>
      <button type="button" class="btn btn-sm" id="quit-btn">Quit server</button>
    </div>
  </header>

  <nav class="nav-rail" id="nav-rail" aria-label="Studio screens"></nav>

  <main class="workspace" id="workspace"></main>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
