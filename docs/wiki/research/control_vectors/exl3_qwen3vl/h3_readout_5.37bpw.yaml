# H3 Readout-Priority Recipe (~5.37 bpw, ~20.65 GiB total GPU weights + 8-bit head + 6-bit vision)
# - Layers 0..49 (H3 encoder trunk): 6 bpw Attention (q/k/v/o), 5 bpw MLP (gate/up/down)
# - Layers 50..63 (14 readout layers above H3's layers.49 tap point): 6 bpw Attention + 6 bpw MLP
# - lm_head: 8 bpw
target_bpw: 5.37
head_bits: 8
tensors:
  "model.language_model.layers.*.mlp.*": 5
  "model.language_model.layers.*.self_attn.*": 6
  "model.language_model.layers.5[0-9].*": 6
  "model.language_model.layers.6[0-3].*": 6
