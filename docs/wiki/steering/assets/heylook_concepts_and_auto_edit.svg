<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="100%" role="img" aria-label="Complete H3 Control Stack: 4 Steering Tools, Closed-Loop Governor, and Studio Surfaces">
  <defs>
    <filter id="cardShadowH3" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.3; filter: url(#cardShadowH3); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 20px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #475569; }
    .sec-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
    .box-title { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.6px; font-weight: 700; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #1e293b; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.4px; fill: #475569; }
    .badge { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.8px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Canvas -->
  <rect x="4" y="4" width="972" height="472" rx="16" class="canvas"/>

  <!-- Header -->
  <text x="28" y="36" class="heading">The Complete MiniMax H3 Control Stack (2026-11-26)</text>
  <text x="28" y="55" class="subhead">Four complementary tools from 1× prompt authoring to 1× attention routing, 1× subspace sliders, and 2× velocity surgery — closed by H3LivePolicy.</text>

  <!-- RUNG 1: PROMPT AUTHORING -->
  <rect x="24" y="74" width="220" height="270" rx="12" class="card"/>
  <rect x="36" y="88" width="114" height="20" rx="10" fill="#4338ca"/>
  <text x="93" y="102" text-anchor="middle" class="badge">1 · 1× AUTHORING</text>
  <text x="36" y="130" class="sec-title">Prompt Expanders</text>
  <text x="36" y="146" class="caption">Fresh plots, blocking, wardrobe</text>

  <rect x="36" y="158" width="196" height="54" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="46" y="176" class="box-title" fill="#3730a3">89 Concept Cards + @extend</text>
  <text x="46" y="192" class="mono">data/edit_concepts/*.toml</text>
  <text x="46" y="205" class="caption">heylook SSE + contract gate</text>

  <rect x="36" y="222" width="196" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="46" y="240" class="mono">MiniMaxH3PromptExpander</text>
  <text x="46" y="256" class="mono">MiniMaxH3ImageExpander</text>
  <text x="46" y="271" class="caption">Auto ref_end_percent (slot 4)</text>

  <text x="36" y="302" class="caption">First choice for new scenes,</text>
  <text x="36" y="317" class="caption">multi-shot dialogue &amp; lights.</text>
  <text x="36" y="333" class="mono" fill="#4338ca">Cost: 1.0× (BasicGuider)</text>

  <!-- RUNG 2: 1x ATTENTION ROUTING & SELF-MASK -->
  <rect x="258" y="74" width="232" height="270" rx="12" class="card"/>
  <rect x="270" y="88" width="142" height="20" rx="10" fill="#7c3aed"/>
  <text x="341" y="102" text-anchor="middle" class="badge">2 · 1× QUERY ROUTING</text>
  <text x="270" y="130" class="sec-title">Split Camera, Mic &amp; Worlds</text>
  <text x="270" y="146" class="caption">Zero vectors · stock 3D RoPE</text>

  <rect x="270" y="158" width="208" height="54" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="280" y="176" class="box-title" fill="#5b21b6">MiniMaxH3QueryRouter</text>
  <text x="280" y="192" class="caption">Dubs, a2v=0.0 Firewall (-32.7 dB),</text>
  <text x="280" y="205" class="caption">late_30_49 binaural, dry redub</text>

  <rect x="270" y="222" width="208" height="62" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="280" y="240" class="box-title" fill="#5b21b6">SpatialQR + SelfMaskRouter</text>
  <text x="280" y="256" class="caption">Split worlds (Video + 4 MP), *_shield,</text>
  <text x="280" y="271" class="caption">17*m cuts, Step-0 noun/speaker/x0</text>

  <text x="270" y="305" class="caption">+ H3LivePolicy closed-loop</text>
  <text x="270" y="320" class="caption">thermostat &amp; auto-mask bus.</text>
  <text x="270" y="335" class="mono" fill="#6d28d9">Cost: 1.0–1.17× (1 pass)</text>

  <!-- RUNG 3: 1x CONTROL VECTORS -->
  <rect x="504" y="74" width="220" height="270" rx="12" class="card"/>
  <rect x="516" y="88" width="128" height="20" rx="10" fill="#0d9488"/>
  <text x="580" y="102" text-anchor="middle" class="badge">3 · 1× STYLE DIALS</text>
  <text x="516" y="130" class="sec-title">Subspace Erasure</text>
  <text x="516" y="146" class="caption">Continuous film, material, audio</text>

  <rect x="516" y="158" width="196" height="54" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="526" y="176" class="box-title" fill="#0f766e">MiniMaxH3Steer (50 Stems)</text>
  <text x="526" y="192" class="caption">Pole-A rank-8 Vr + mu_d (193 KB)</text>
  <text x="526" y="205" class="caption">peer_ros + 95.5→98.5 knee</text>

  <rect x="516" y="222" width="196" height="56" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="526" y="240" class="box-title" fill="#0f766e">4-Bus + Stage 2 Hooks</text>
  <text x="526" y="256" class="caption">blocks.20..49 face-safe · 1× Q_aud</text>
  <text x="526" y="271" class="caption">fl2va · ref2va · h3_image · J-Lens</text>

  <text x="516" y="302" class="caption">Zero prompt rewrites; tuned live</text>
  <text x="516" y="317" class="caption">by taeh3 Preview Thermostat.</text>
  <text x="516" y="333" class="mono" fill="#0f766e">Cost: 1.0× (0 extra steps)</text>

  <!-- RUNG 4: 2x EDIT GUIDER & CHOREOGRAPHY -->
  <rect x="738" y="74" width="218" height="270" rx="12" class="card"/>
  <rect x="750" y="88" width="128" height="20" rx="10" fill="#b45309"/>
  <text x="814" y="102" text-anchor="middle" class="badge">4 · 2× SURGERY</text>
  <text x="750" y="130" class="sec-title">EditGuider &amp; Portals</text>
  <text x="750" y="146" class="caption">Keep-take swaps &amp; moving masks</text>

  <rect x="750" y="158" width="194" height="54" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="760" y="176" class="box-title" fill="#92400e">MiniMaxH3EditGuider</text>
  <text x="760" y="192" class="caption">lock_take · video_only · scale×</text>
  <text x="760" y="205" class="caption">Auto-pulls SelfMask harvest (tb1)</text>

  <rect x="750" y="222" width="194" height="56" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="760" y="240" class="box-title" fill="#92400e">Director + D-Pad + Cues</text>
  <text x="760" y="256" class="caption">Moving portals · SAM 3.1 masks</text>
  <text x="760" y="271" class="caption">Dual-sprite D-Pad + 3f SoundCues</text>

  <text x="750" y="302" class="caption">Exact prop/wardrobe swaps &amp;</text>
  <text x="750" y="317" class="caption">smooth curved moving portals.</text>
  <text x="750" y="333" class="mono" fill="#b45309">Cost: 2.0× (lazy=True 1× skip)</text>

  <!-- Subtle Flow Arrows -->
  <line x1="244" y1="208" x2="256" y2="208" stroke="#475569" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="490" y1="208" x2="502" y2="208" stroke="#475569" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="724" y1="208" x2="736" y2="208" stroke="#475569" stroke-width="1.6" marker-end="url(#arrDark)"/>

  <!-- BOTTOM SURFACE BAR -->
  <rect x="24" y="360" width="932" height="100" rx="12" class="card"/>
  <rect x="40" y="374" width="150" height="22" rx="11" fill="#334155"/>
  <text x="115" y="389" text-anchor="middle" class="badge">UNIFIED SURFACES</text>
  <text x="204" y="390" class="sec-title">H3 Studio 2.0 (app/, iOS 27.x Safari + Desktop) · Spatial Director (director/) · 69 Nodes</text>

  <rect x="40" y="408" width="296" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="424" class="box-title" fill="#4338ca">app/ / — Studio 2.0 (61b69aa)</text>
  <text x="52" y="438" class="caption">Twist Bar · World Split/SelfMask · Scout 4× · 4-Bus</text>

  <rect x="350" y="408" width="294" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="362" y="424" class="box-title" fill="#0f766e">app/ /lab — Integrated Vector Lab</text>
  <text x="362" y="438" class="caption">Vibe Search · X-Ray · Rank-16 Sculpt · Gates A–D</text>

  <rect x="658" y="408" width="282" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="424" class="box-title" fill="#b45309">director/ — Interactive Timeline Stage</text>
  <text x="670" y="438" class="caption">SAM 3.1 Portals · Dual-Sprite D-Pad · Re-Dub</text>
</svg>
