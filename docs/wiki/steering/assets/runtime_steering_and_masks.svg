<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 392" width="100%" height="100%" role="img" aria-label="Selective token masking, verified early commit window 0.0 to 0.50, blocks.20..49 face-safe band, and live preview thermostat">
  <defs>
    <filter id="cardShadow3" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrTeal3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#cardShadow3); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #52525b; }
    .sec-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 14.5px; font-weight: 700; fill: #1e293b; }
    .box-title { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.6px; fill: #475569; }
    .badge { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Warm Paper Background -->
  <rect x="4" y="4" width="932" height="384" rx="16" class="canvas"/>

  <!-- Header -->
  <text x="30" y="36" class="heading">Selective Token Masking, Early Commit Window &amp; Depth Bands</text>
  <text x="30" y="55" class="subhead">Steer scene look and soundscape while protecting reference photos, spoken lip-sync, and late-step facial fidelity.</text>

  <!-- TOP CARD: SELECTIVE TOKEN MASK (mask="scene_only") -->
  <rect x="26" y="72" width="888" height="148" rx="12" class="card"/>
  <text x="46" y="98" class="sec-title">1. Token-Span Masking (Default: scene_only · protects refs &amp; &lt;d&gt; speech)</text>

  <rect x="640" y="82" width="252" height="22" rx="11" fill="#0d9488"/>
  <text x="766" y="97" text-anchor="middle" class="badge" fill="#ffffff">MiniMaxH3Steer (Pole-A Erasure)</text>

  <!-- Block 1: Reference Photos (Locked) -->
  <rect x="46" y="122" width="198" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="145" class="box-title" fill="#475569">Reference Images</text>
  <text x="60" y="162" class="caption">&lt;Picture 1&gt; vision patches</text>
  <text x="60" y="182" class="badge" fill="#64748b">LOCKED (retention_analysis)</text>

  <!-- Block 2: Scene & Visual Prose (Steered) -->
  <rect x="260" y="122" width="222" height="78" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="274" y="145" class="box-title" fill="#0f766e">Visual Scene Description</text>
  <text x="274" y="162" class="caption" fill="#115e59">Lighting, weather, camera, action</text>
  <text x="274" y="182" class="badge" fill="#0d9488">STEERED (Pole-A Erase + Push)</text>

  <!-- Block 3: Spoken Dialogue (Locked) -->
  <rect x="498" y="122" width="194" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="512" y="145" class="box-title" fill="#475569">Spoken Dialogue</text>
  <text x="512" y="162" class="caption">(S1) &lt;d&gt;Speech words&lt;/d&gt;</text>
  <text x="512" y="182" class="badge" fill="#64748b">LOCKED (Lip-Sync Intact)</text>

  <!-- Block 4: Soundscape Prose (Steered) -->
  <rect x="708" y="122" width="186" height="78" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="722" y="145" class="box-title" fill="#0f766e">Ambient Soundscape</text>
  <text x="722" y="162" class="caption" fill="#115e59">Room tone, weather, foley</text>
  <text x="722" y="182" class="badge" fill="#0d9488">STEERED (or 1× Q_aud split)</text>

  <!-- BOTTOM CARD: VERIFIED EARLY COMMIT WINDOW + DEPTH BAND + LIVE GOVERNOR -->
  <rect x="26" y="234" width="888" height="136" rx="12" class="card"/>
  <text x="46" y="260" class="sec-title">2. Verified Step &amp; Depth Windows (Early Palette Lock-In + Live Governor)</text>

  <!-- Left: Verified 0.0 -> 0.50 Early Commit Window -->
  <text x="46" y="284" class="box-title" fill="#0f766e">Early Commit Window (0.0 → 0.50 · ew50 == full)</text>
  <text x="46" y="300" class="caption">Steps 0–2 lock global palette &amp; style; turning off at 0.50 stops face burn.</text>
  <rect x="46" y="310" width="194" height="22" rx="7" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.3"/>
  <text x="143" y="325" text-anchor="middle" class="badge" fill="#0f766e">0.0 → 0.50 · ACTIVE COMMIT</text>
  <rect x="246" y="310" width="188" height="22" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="340" y="325" text-anchor="middle" class="badge" fill="#64748b">0.50 → 1.0 · CLEAN DETAIL</text>
  <text x="46" y="352" class="mono" fill="#b91c1c">Note: Late-start (0.34 → 1.0) fails to flip global palette!</text>

  <!-- Divider -->
  <line x1="458" y1="274" x2="458" y2="356" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right: Depth Band + H3LivePolicy Thermostat -->
  <text x="480" y="284" class="box-title" fill="#4338ca">Face-Safe Depth Band &amp; Live Thermostat</text>
  <text x="480" y="300" class="caption">Leave blocks.0..19 unsteered to hold &lt;Picture 1&gt; likeness (1.75× ID).</text>
  <rect x="480" y="310" width="144" height="22" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="552" y="325" text-anchor="middle" class="badge" fill="#475569">blocks.0..19 · FACE LOCK</text>
  <rect x="630" y="310" width="264" height="22" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <text x="762" y="325" text-anchor="middle" class="badge" fill="#3730a3">blocks.20..49 · STYLE &amp; AUDIO STEER</text>
  <text x="480" y="352" class="mono" fill="#0f766e">+ H3LivePolicy tunes strength_scale &amp; 0.33↔0.50 ref release</text>
</svg>
