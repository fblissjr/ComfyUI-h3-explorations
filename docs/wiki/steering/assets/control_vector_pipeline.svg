<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 392" width="100%" height="100%" role="img" aria-label="How 10 prompt pairs extract a Pole-A Subspace Erasure control vector across fl2va, ref2va, and h3_image">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#cardShadow); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #52525b; }
    .step-num { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 700; fill: #0d9488; letter-spacing: 0.6px; }
    .card-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 14.5px; font-weight: 700; fill: #1e293b; }
    .label { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 600; fill: #334155; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.6px; fill: #475569; }
    .pill-txt { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Warm Paper Background -->
  <rect x="4" y="4" width="932" height="384" rx="16" class="canvas"/>

  <!-- Header -->
  <text x="30" y="36" class="heading">How a Pole-A Subspace Erasure Control Vector Works</text>
  <text x="30" y="55" class="subhead">10 contrasting scene pairs extract both a clean target push (μ̂_d) and a rank-8 baseline eraser (V_r) in a 193 KB file.</text>

  <!-- CARD 1: 10 CONTRASTING PAIRS -->
  <rect x="26" y="74" width="274" height="292" rx="12" class="card"/>
  <text x="44" y="100" class="step-num">STEP 1 · EXTRACT ONCE</text>
  <text x="44" y="120" class="card-title">10 Contrasting Scene Pairs</text>

  <rect x="44" y="136" width="238" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="153" class="caption">Scene 1: Watchmaker (Gates A–D)</text>
  <rect x="56" y="160" width="84" height="15" rx="4" fill="#eff6ff"/>
  <text x="64" y="171" class="pill-txt" fill="#2563eb">Pole A: Mild</text>
  <text x="148" y="171" class="caption">→</text>
  <rect x="164" y="160" width="106" height="15" rx="4" fill="#fff7ed"/>
  <text x="172" y="171" class="pill-txt" fill="#d97706">Pole B: Heatwave</text>

  <rect x="44" y="190" width="238" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="207" class="caption">Scene 2: Coastal Pier (rotated A)</text>
  <rect x="56" y="214" width="84" height="15" rx="4" fill="#eff6ff"/>
  <text x="64" y="225" class="pill-txt" fill="#2563eb">Pole A: Cool</text>
  <text x="148" y="225" class="caption">→</text>
  <rect x="164" y="214" width="106" height="15" rx="4" fill="#fff7ed"/>
  <text x="172" y="225" class="pill-txt" fill="#d97706">Pole B: Heatwave</text>

  <rect x="44" y="244" width="238" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="261" class="caption">Scene 3..10: Subway, Café, Porch...</text>
  <text x="56" y="278" class="mono" fill="#0f766e">pooling = diff_span (med_fd ≥ 10)</text>

  <text x="44" y="316" class="caption">Subjects cancel across diverse prefixes;</text>
  <text x="44" y="332" class="caption">only the causal Pole A → B contrast</text>
  <text x="44" y="348" class="caption" fill="#0f766e" font-weight="700">survives post-TokenRefiner (5376-D).</text>

  <!-- Connector 1 -> 2 -->
  <line x1="302" y1="220" x2="328" y2="220" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- CARD 2: POLE-A SUBSPACE ERASURE PAYLOAD -->
  <rect x="334" y="74" width="272" height="292" rx="12" class="card"/>
  <text x="352" y="100" class="step-num">STEP 2 · SOLVE &amp; SAVE (193 KB)</text>
  <text x="352" y="120" class="card-title">Push μ̂_d + Rank-8 Eraser V_r</text>

  <rect x="352" y="136" width="236" height="66" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="364" y="155" class="label" fill="#0f766e">1. Target Direction (erasure.mu_d)</text>
  <text x="364" y="172" class="caption">ColBERT row-softmax (τ=0.15) match</text>
  <text x="364" y="188" class="mono" fill="#115e59">Adds crisp Pole-B look/physics</text>

  <rect x="352" y="212" width="236" height="66" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="364" y="231" class="label" fill="#3730a3">2. Pole-A Subspace (erasure.vr)</text>
  <text x="364" y="248" class="caption">Rank-8 SVD (rank-16 sculpted union)</text>
  <text x="364" y="264" class="mono" fill="#4338ca">Erases opposing prompt cues first</text>

  <rect x="352" y="290" width="236" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="364" y="308" class="label" fill="#1e293b">50 Active Bank Stems (.safetensors)</text>
  <text x="364" y="324" class="mono" fill="#0f766e">fl2va · ref2va · h3_image</text>
  <text x="364" y="340" class="caption">&lt;15 ms CPU J-Lens X-Ray audit</text>

  <!-- Connector 2 -> 3 -->
  <line x1="608" y1="220" x2="634" y2="220" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- CARD 3: STEER ANY NEW SCENE AT 1x -->
  <rect x="640" y="74" width="274" height="292" rx="12" class="card"/>
  <text x="658" y="100" class="step-num">STEP 3 · STEER AT 1× SPEED</text>
  <text x="658" y="120" class="card-title">Apply &amp; Stack Safely</text>

  <rect x="658" y="136" width="238" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="670" y="155" class="label">Your Untouched Scene Prompt</text>
  <text x="670" y="172" class="caption">Same text length L · zero rewrites</text>

  <rect x="658" y="196" width="238" height="58" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="670" y="214" class="mono" fill="#92400e">add_norm_matched_erasure</text>
  <text x="670" y="230" class="caption">H' = H − P_Vr(H−h̄) + s·μ̂_d (67.5 RMS)</text>
  <text x="670" y="245" class="caption">Stage 1: peer_ros + 95.5→98.5 knee</text>

  <rect x="658" y="266" width="238" height="84" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="670" y="285" class="label" fill="#065f46">Steered Video, Audio, or 4 MP Still</text>
  <text x="670" y="302" class="caption">• Stage 2: blocks.20..49 &amp; 1× Q_aud</text>
  <text x="670" y="318" class="caption">• 4-Bus Mixer (Look/Motion/Audio/Hold)</text>
  <text x="670" y="334" class="caption">• Live taeh3 thermostat (tb2: +0.01s)</text>
</svg>
