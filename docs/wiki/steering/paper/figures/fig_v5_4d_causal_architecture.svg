<text x="206" y="272" fill="#e2e8f0" font-size="10.2">V_r^(j) perp mu_d^(-j), union lam_max &lt;= 1.0</text>
<text x="58" y="294" fill="#c4b5fd" font-size="10.5" font-weight="600">4. Smooth Norm Knee:</text>
<text x="206" y="294" fill="#e2e8f0" font-size="10.2">67.5 RMS match + soft cap 95.5 -&gt; 98.5 (0 diptychs)</text>
<text x="58" y="316" fill="#7dd3fc" font-size="10.5" font-weight="600">5. Bus-Scoped V_r (CPU):</text>
<text x="206" y="316" fill="#e2e8f0" font-size="10.2">7.94x look&lt;-&gt;audio overlap cut at 100% Look retention</text>
