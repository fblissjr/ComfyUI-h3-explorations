<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%" role="img" aria-label="Visual explainer of selective token masking and diffusion step windows">
  <defs>
    <filter id="cardShadow3" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrTeal3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; rx: 16px; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; rx: 12px; filter: url(#cardShadow3); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19px; font-weight: 600; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #64748b; }
    .sec-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 14.5px; font-weight: 600; fill: #1e293b; }
    .box-title { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 600; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
    .badge { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 700; }

    .steer-block {
      fill: #f0fdfa;
      stroke: #0d9488;
      stroke-width: 1.6;
      rx: 10px;
      animation: liftSteer 3.2s ease-in-out infinite;
    }
    .lock-block {
      fill: #f8fafc;
      stroke: #cbd5e1;
      stroke-width: 1.2;
      rx: 10px;
    }
    .flow-arrow {
      stroke-dasharray: 4 4;
      animation: dropFlow 1.5s linear infinite;
    }
    .playhead {
      animation: sweepSteps 5.5s ease-in-out infinite;
    }

    @keyframes liftSteer {
      0%, 100% { fill: #f0fdfa; stroke-width: 1.4; }
      50% { fill: #ccfbf1; stroke-width: 2.2; }
    }
    @keyframes dropFlow {
      from { stroke-dashoffset: 16; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes sweepSteps {
      0% { transform: translateX(0px); }
      85%, 100% { transform: translateX(350px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .steer-block, .flow-arrow, .playhead { animation: none; }
    }
  </style>

  <!-- Warm Paper Background -->
  <rect x="4" y="4" width="912" height="362" class="canvas"/>

  <!-- Header -->
  <text x="32" y="38" class="heading">Selective Token Masking &amp; Step Windows</text>
  <text x="32" y="58" class="subhead">Steer scene look and soundscape while protecting reference photos and spoken lip-sync.</text>

  <!-- ===================================================================== -->
  <!-- TOP CARD: SELECTIVE TOKEN MASK (mask="scene_only")                    -->
  <!-- ===================================================================== -->
  <rect x="28" y="76" width="864" height="148" class="card"/>
  <text x="48" y="102" class="sec-title">1. Token-Span Masking (Default: scene_only)</text>

  <!-- Control Vector Top Pill -->
  <rect x="410" y="86" width="210" height="24" rx="12" fill="#0d9488"/>
  <text x="454" y="102" class="badge" fill="#ffffff">Control Vector (+v)</text>

  <!-- Animated Arrows into Steered Blocks Only -->
  <path d="M 465 110 L 366 132" fill="none" stroke="#0d9488" stroke-width="2" class="flow-arrow" marker-end="url(#arrTeal3)"/>
  <path d="M 565 110 L 766 132" fill="none" stroke="#0d9488" stroke-width="2" class="flow-arrow" marker-end="url(#arrTeal3)"/>

  <!-- Block 1: Reference Photos (Locked) -->
  <rect x="48" y="136" width="188" height="68" class="lock-block"/>
  <text x="64" y="159" class="box-title" fill="#475569">Reference Images</text>
  <text x="64" y="176" class="caption">&lt;Picture 1&gt; vision patches</text>
  <text x="64" y="194" class="badge" fill="#64748b">🔒 Protected (Unchanged)</text>

  <!-- Block 2: Scene & Visual Prose (Steered) -->
  <rect x="252" y="136" width="228" height="68" class="steer-block"/>
  <text x="268" y="159" class="box-title" fill="#0f766e">Visual Scene Description</text>
  <text x="268" y="176" class="caption" fill="#115e59">Lighting, weather, camera, action</text>
  <text x="268" y="194" class="badge" fill="#0d9488">✦ Steered by Vector</text>

  <!-- Block 3: Spoken Dialogue (Locked) -->
  <rect x="496" y="136" width="180" height="68" class="lock-block"/>
  <text x="512" y="159" class="box-title" fill="#475569">Spoken Dialogue</text>
  <text x="512" y="176" class="caption">(S1) &lt;d&gt;Speech words&lt;/d&gt;</text>
  <text x="512" y="194" class="badge" fill="#64748b">🔒 Protected (Lip-Sync)</text>

  <!-- Block 4: Soundscape Prose (Steered) -->
  <rect x="692" y="136" width="180" height="68" class="steer-block"/>
  <text x="708" y="159" class="box-title" fill="#0f766e">Ambient Soundscape</text>
  <text x="708" y="176" class="caption" fill="#115e59">Room tone, weather, foley</text>
  <text x="708" y="194" class="badge" fill="#0d9488">✦ Steered by Vector</text>

  <!-- ===================================================================== -->
  <!-- BOTTOM CARD: DENOISING STEP SCHEDULE                                  -->
  <!-- ===================================================================== -->
  <rect x="28" y="238" width="864" height="108" class="card"/>
  <text x="48" y="264" class="sec-title">2. When the Vector Applies Across Denoising Steps</text>

  <!-- Left Schedule: Full Schedule (0.0 -> 1.0) -->
  <text x="48" y="290" class="box-title" fill="#0f766e">Full Schedule (0.0 → 1.0 Default)</text>
  <text x="48" y="306" class="caption">Steers motion, physics, camera &amp; weather from Step 1</text>
  <rect x="48" y="315" width="360" height="16" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <circle cx="56" cy="323" r="5" fill="#0f766e" class="playhead"/>

  <!-- Divider -->
  <line x1="452" y1="254" x2="452" y2="332" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right Schedule: Late Appearance Window (0.33 -> 1.0) -->
  <text x="480" y="290" class="box-title" fill="#b45309">Late Appearance Window (0.33 → 1.0)</text>
  <text x="480" y="306" class="caption">First 33% locks baseline pose &amp; framing; last 67% grades film stock</text>
  <rect x="480" y="315" width="118" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="502" y="327" class="badge" fill="#64748b" font-size="9.5">Pose Locked</text>
  <rect x="604" y="315" width="256" height="16" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="678" y="327" class="badge" fill="#b45309" font-size="9.5">Film Look Active</text>
</svg>
