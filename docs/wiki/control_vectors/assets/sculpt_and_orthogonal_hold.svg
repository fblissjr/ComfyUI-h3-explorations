<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%" role="img" aria-label="Visual explainer of Gram-Schmidt orthogonal hold and vector inversion">
  <defs>
    <filter id="cardShadow4" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrTeal4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrAmber4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrRose4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrBlue4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; rx: 16px; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; rx: 12px; filter: url(#cardShadow4); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19px; font-weight: 600; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #64748b; }
    .card-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }

    .proj-line {
      stroke-dasharray: 5 4;
      animation: scrubDrift 3.8s ease-in-out infinite;
    }
    .pure-vec {
      animation: pulsePure 3.8s ease-in-out infinite;
    }
    .raw-fade {
      animation: dimRaw 3.8s ease-in-out infinite;
    }
    .invert-arrow {
      animation: pulseInvert 3.8s ease-in-out infinite;
    }

    @keyframes scrubDrift {
      0%, 20% { opacity: 0.25; stroke-dashoffset: 18; }
      50%, 85% { opacity: 1; stroke-dashoffset: 0; }
      100% { opacity: 0.25; stroke-dashoffset: -18; }
    }
    @keyframes pulsePure {
      0%, 20% { opacity: 0.5; }
      50%, 85% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    @keyframes dimRaw {
      0%, 20% { opacity: 0.95; }
      50%, 85% { opacity: 0.35; }
      100% { opacity: 0.95; }
    }
    @keyframes pulseInvert {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .proj-line, .pure-vec, .raw-fade, .invert-arrow { animation: none; }
    }
  </style>

  <!-- Warm Paper Background -->
  <rect x="4" y="4" width="912" height="352" class="canvas"/>

  <!-- Header -->
  <text x="32" y="38" class="heading">Orthogonal Hold &amp; Instant Vector Inversion</text>
  <text x="32" y="58" class="subhead">Remove unwanted side effects at 90° or flip any vector to its opposite in under 5 ms on CPU.</text>

  <!-- ===================================================================== -->
  <!-- LEFT CARD: ORTHOGONAL HOLD (GRAM-SCHMIDT SCRUB)                       -->
  <!-- ===================================================================== -->
  <rect x="28" y="76" width="420" height="258" class="card"/>
  <text x="48" y="104" class="card-title">1. Orthogonal Hold (Remove Side Effects)</text>
  <text x="48" y="122" class="caption">Keep the target effect while projecting out correlated background drift</text>

  <!-- Geometry Plot Box -->
  <rect x="48" y="136" width="380" height="176" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Origin at (112, 276) -->
  <!-- Horizontal Drift Axis -->
  <line x1="96" y1="276" x2="396" y2="276" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="112" y1="276" x2="312" y2="276" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrRose4)"/>
  <text x="206" y="296" class="label" fill="#be123c">Hold Axis (Unwanted Drift)</text>

  <!-- Vertical Pure Target Axis -->
  <line x1="112" y1="290" x2="112" y2="168" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="112" y1="276" x2="112" y2="180" stroke="#0d9488" stroke-width="3.2" class="pure-vec" marker-end="url(#arrTeal4)"/>
  <text x="72" y="156" class="label" fill="#0f766e">Cleaned Vector (90° · Zero Drift)</text>

  <!-- 90-degree right angle symbol -->
  <polyline points="112,262 126,262 126,276" fill="none" stroke="#0d9488" stroke-width="1.4"/>

  <!-- Diagonal Raw Entangled Vector -->
  <line x1="112" y1="276" x2="296" y2="180" stroke="#d97706" stroke-width="2.4" class="raw-fade" marker-end="url(#arrAmber4)"/>
  <text x="308" y="184" class="label" fill="#b45309">Raw Vector</text>
  <text x="308" y="199" class="caption">(Target + Drift)</text>

  <!-- Animated Projection Scrub Arrow -->
  <line x1="296" y1="180" x2="296" y2="276" stroke="#e11d48" stroke-width="1.4" class="proj-line"/>
  <line x1="296" y1="180" x2="120" y2="180" stroke="#0d9488" stroke-width="2" class="proj-line" marker-end="url(#arrTeal4)"/>

  <!-- ===================================================================== -->
  <!-- RIGHT CARD: INSTANT INVERSION & NORM-MATCHED BLENDING                 -->
  <!-- ===================================================================== -->
  <rect x="472" y="76" width="420" height="258" class="card"/>
  <text x="492" y="104" class="card-title">2. Flip (−1×) or Blend on Equal Footing</text>
  <text x="492" y="122" class="caption">Scale vectors to the same 67.5 circle, or invert any preset 180°</text>

  <!-- Circle Plot Box -->
  <rect x="492" y="136" width="380" height="176" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Normalized Circle at Center (682, 224), r=66 -->
  <circle cx="682" cy="224" r="66" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="634" y="304" class="caption" font-size="10.5">Normalized 67.5 Strength Circle</text>

  <!-- Positive Pole (+1.0x) -->
  <line x1="682" y1="224" x2="738" y2="188" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber4)"/>
  <rect x="746" y="168" width="114" height="36" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="756" y="184" class="label" fill="#b45309">+1.0 × Vector</text>
  <text x="756" y="198" class="caption" fill="#c2410c">Push toward Pole B</text>

  <!-- Negative / Inverted Pole (-1.0x) -->
  <line x1="682" y1="224" x2="626" y2="260" stroke="#2563eb" stroke-width="3" class="invert-arrow" marker-end="url(#arrBlue4)"/>
  <rect x="504" y="244" width="114" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="514" y="260" class="label" fill="#1d4ed8">−1.0 × (--invert)</text>
  <text x="514" y="274" class="caption" fill="#2563eb">Opposite (Pole A)</text>

  <!-- Center Pivot -->
  <circle cx="682" cy="224" r="4" fill="#1e293b"/>
</svg>
