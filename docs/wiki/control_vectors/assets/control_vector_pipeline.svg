<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" role="img" aria-label="Visual explainer of how 10 prompt pairs extract a clean control vector and steer video generation">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; rx: 16px; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; rx: 12px; filter: url(#cardShadow); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19px; font-weight: 600; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #64748b; }
    .step-num { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #0d9488; letter-spacing: 0.8px; }
    .card-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
    .label { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #64748b; }
    .pill-txt { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; }

    /* Subtle editorial animations */
    .cancel-subj {
      animation: subjFade 4.5s ease-in-out infinite;
    }
    .keep-axis {
      animation: axisPulse 4.5s ease-in-out infinite;
    }
    .fan-line {
      animation: fanConverge 4.5s ease-in-out infinite;
    }
    .flow-connector {
      stroke-dasharray: 5 5;
      animation: flowDots 1.8s linear infinite;
    }
    .steer-glow {
      animation: warmShift 4.5s ease-in-out infinite;
    }

    @keyframes subjFade {
      0%, 20% { opacity: 0.9; }
      50%, 80% { opacity: 0.25; }
      100% { opacity: 0.9; }
    }
    @keyframes axisPulse {
      0%, 20% { transform: scale(1); }
      50%, 80% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    @keyframes fanConverge {
      0%, 20% { opacity: 0.75; }
      55%, 85% { opacity: 0.18; }
      100% { opacity: 0.75; }
    }
    @keyframes flowDots {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes warmShift {
      0%, 25% { fill: #f1f5f9; stroke: #cbd5e1; }
      55%, 85% { fill: #fffbeb; stroke: #f59e0b; }
      100% { fill: #f1f5f9; stroke: #cbd5e1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cancel-subj, .keep-axis, .fan-line, .flow-connector, .steer-glow { animation: none; }
    }
  </style>

  <!-- Warm Paper Background -->
  <rect x="4" y="4" width="912" height="372" class="canvas"/>

  <!-- Editorial Header -->
  <text x="32" y="38" class="heading">How a Control Vector Works</text>
  <text x="32" y="58" class="subhead">Subjects cancel out across 10 contrasting scenes, isolating one pure visual or audio direction.</text>

  <!-- ===================================================================== -->
  <!-- CARD 1: 10 CONTRASTING PAIRS                                          -->
  <!-- ===================================================================== -->
  <rect x="28" y="78" width="268" height="272" class="card"/>
  <text x="48" y="104" class="step-num">STEP 1 · EXTRACT ONCE</text>
  <text x="48" y="124" class="card-title">10 Contrasting Scene Pairs</text>

  <!-- Scene Pair Row 1 -->
  <rect x="46" y="142" width="232" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="160" class="caption cancel-subj">Scene 1: Watchmaker</text>
  <rect x="58" y="166" width="76" height="15" rx="4" fill="#eff6ff"/>
  <text x="65" y="177" class="pill-txt" fill="#2563eb" font-size="9.5">− Mild Air</text>
  <text x="142" y="177" class="caption">→</text>
  <rect x="158" y="166" width="108" height="15" rx="4" fill="#fff7ed"/>
  <text x="165" y="177" class="pill-txt" fill="#d97706" font-size="9.5">+ Heatwave</text>

  <!-- Scene Pair Row 2 -->
  <rect x="46" y="196" width="232" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="214" class="caption cancel-subj">Scene 2: Coastal Pier</text>
  <rect x="58" y="220" width="76" height="15" rx="4" fill="#eff6ff"/>
  <text x="65" y="231" class="pill-txt" fill="#2563eb" font-size="9.5">− Mild Air</text>
  <text x="142" y="231" class="caption">→</text>
  <rect x="158" y="220" width="108" height="15" rx="4" fill="#fff7ed"/>
  <text x="165" y="231" class="pill-txt" fill="#d97706" font-size="9.5">+ Heatwave</text>

  <!-- Scene Pair Row 3 -->
  <rect x="46" y="250" width="232" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="268" class="caption cancel-subj">Scene 3..10: Subway, Café...</text>
  <rect x="58" y="274" width="76" height="15" rx="4" fill="#eff6ff"/>
  <text x="65" y="285" class="pill-txt" fill="#2563eb" font-size="9.5">− Mild Air</text>
  <text x="142" y="285" class="caption">→</text>
  <rect x="158" y="274" width="108" height="15" rx="4" fill="#fff7ed"/>
  <text x="165" y="285" class="pill-txt" fill="#d97706" font-size="9.5">+ Heatwave</text>

  <text x="48" y="324" class="caption">Different subjects fade out;</text>
  <text x="48" y="338" class="caption" fill="#0d9488" font-weight="600">only the shared B − A shift remains.</text>

  <!-- Connector 1 -> 2 -->
  <line x1="296" y1="214" x2="324" y2="214" stroke="#0d9488" stroke-width="2" class="flow-connector" marker-end="url(#arrowTeal)"/>

  <!-- ===================================================================== -->
  <!-- CARD 2: ISOLATE THE CONCEPT DIRECTION                                 -->
  <!-- ===================================================================== -->
  <rect x="328" y="78" width="264" height="272" class="card"/>
  <text x="348" y="104" class="step-num">STEP 2 · AVERAGE &amp; SAVE</text>
  <text x="348" y="124" class="card-title">One Pure Direction (v)</text>

  <!-- Visual Vector Convergence Canvas -->
  <rect x="348" y="142" width="224" height="142" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Faint individual pair vectors fanning out (subject noise) -->
  <line x1="376" y1="246" x2="495" y2="162" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" class="fan-line" marker-end="url(#arrowSlate)"/>
  <line x1="376" y1="246" x2="520" y2="174" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" class="fan-line" marker-end="url(#arrowSlate)"/>
  <line x1="376" y1="246" x2="532" y2="225" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" class="fan-line" marker-end="url(#arrowSlate)"/>
  <line x1="376" y1="246" x2="508" y2="244" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" class="fan-line" marker-end="url(#arrowSlate)"/>
  <text x="452" y="264" class="caption" font-size="10">Individual pairs</text>

  <!-- Bold Mean Control Vector v -->
  <line x1="376" y1="246" x2="534" y2="188" stroke="#0d9488" stroke-width="3.5" marker-end="url(#arrowTeal)"/>
  <circle cx="376" cy="246" r="4" fill="#0f172a"/>
  <rect x="424" y="154" width="118" height="22" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="434" y="169" class="pill-txt" fill="#0f766e">Control Vector v</text>

  <!-- Saved Badge -->
  <rect x="348" y="296" width="224" height="38" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="362" y="313" class="label" fill="#115e59" font-weight="600">Saved as .safetensors</text>
  <text x="362" y="327" class="caption" fill="#0f766e">5,376-D post-refiner direction</text>

  <!-- Connector 2 -> 3 -->
  <line x1="592" y1="214" x2="620" y2="214" stroke="#0d9488" stroke-width="2" class="flow-connector" marker-end="url(#arrowTeal)"/>

  <!-- ===================================================================== -->
  <!-- CARD 3: STEER ANY NEW PROMPT AT RENDER TIME                           -->
  <!-- ===================================================================== -->
  <rect x="624" y="78" width="268" height="272" class="card"/>
  <text x="644" y="104" class="step-num">STEP 3 · STEER AT RENDER TIME</text>
  <text x="644" y="124" class="card-title">Apply to Any New Scene</text>

  <!-- New Unsteered Prompt Box -->
  <rect x="644" y="142" width="228" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="160" class="label" font-weight="600">Your Scene Prompt</text>
  <text x="656" y="177" class="caption">Unchanged text &amp; token length L</text>

  <!-- Plus Sign + Vector Injection Pill -->
  <line x1="758" y1="190" x2="758" y2="246" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
  <rect x="672" y="204" width="172" height="28" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="692" y="222" class="pill-txt" fill="#0f766e">+ strength × Vector v</text>

  <!-- Steered Output Scene -->
  <rect x="644" y="252" width="228" height="82" rx="10" class="steer-glow" stroke-width="1.5"/>
  <text x="660" y="274" class="label" font-weight="600" fill="#1e293b">Steered Video + Audio</text>
  <text x="660" y="293" class="caption">Same framing, pose &amp; lip-sync,</text>
  <text x="660" y="308" class="caption">now rendered in a <tspan class="pill-txt" fill="#b45309">Heatwave</tspan></text>
  <text x="660" y="324" class="caption" font-size="10.5">(Flip strength to −1.0 for the opposite)</text>
</svg>
