<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="100%" role="img" aria-label="Visual explainer of surgical diff_span token pooling">
  <defs>
    <filter id="cardShadow2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrTeal2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; rx: 16px; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; rx: 12px; filter: url(#cardShadow2); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19px; font-weight: 600; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #64748b; }
    .row-lbl { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 13.5px; font-weight: 600; fill: #1e293b; }
    .pill-txt { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
    .caption { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; fill: #64748b; }
    .tag { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; }

    .same-pill {
      fill: #f1f5f9;
      stroke: #e2e8f0;
      rx: 8px;
      animation: dimUnchanged 4.2s ease-in-out infinite;
    }
    .same-txt {
      fill: #94a3b8;
      animation: dimUnchanged 4.2s ease-in-out infinite;
    }
    .spotlight-box {
      fill: #f0fdfa;
      stroke: #0d9488;
      stroke-width: 1.6;
      stroke-dasharray: 5 4;
      rx: 12px;
      animation: spotPulse 4.2s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 5 5;
      animation: flowDown 1.6s linear infinite;
    }

    @keyframes dimUnchanged {
      0%, 20% { opacity: 0.85; }
      45%, 85% { opacity: 0.32; }
      100% { opacity: 0.85; }
    }
    @keyframes spotPulse {
      0%, 20% { fill-opacity: 0.35; stroke-opacity: 0.5; }
      45%, 85% { fill-opacity: 0.85; stroke-opacity: 1; }
      100% { fill-opacity: 0.35; stroke-opacity: 0.5; }
    }
    @keyframes flowDown {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .same-pill, .same-txt, .spotlight-box, .flow-line { animation: none; }
    }
  </style>

  <!-- Warm Paper Background -->
  <rect x="4" y="4" width="912" height="342" class="canvas"/>

  <!-- Header -->
  <text x="32" y="38" class="heading">Surgical Token Pooling (diff_span)</text>
  <text x="32" y="58" class="subhead">Only the words that actually change between Prompt A and Prompt B are pooled into the vector.</text>

  <!-- Main Token Ribbon Card -->
  <rect x="28" y="76" width="864" height="164" class="card"/>

  <!-- Spotlight Window Around the Changed Clause -->
  <rect x="334" y="88" width="286" height="140" class="spotlight-box"/>
  <text x="394" y="106" class="tag" fill="#0f766e">POOLED SPAN (diff_span)</text>

  <!-- Prompt A Ribbon -->
  <text x="48" y="142" class="row-lbl">Prompt A</text>
  <text x="48" y="157" class="caption" font-size="10.5">Baseline</text>

  <rect x="132" y="122" width="188" height="36" class="same-pill"/>
  <text x="150" y="145" class="pill-txt same-txt">A watchmaker at a bench</text>

  <rect x="348" y="120" width="258" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="368" y="145" class="pill-txt" fill="#1d4ed8" font-weight="600">under cool overcast light</text>

  <rect x="634" y="122" width="236" height="36" class="same-pill"/>
  <text x="652" y="145" class="pill-txt same-txt">adjusts a tiny brass gear.</text>

  <!-- Prompt B Ribbon -->
  <text x="48" y="198" class="row-lbl">Prompt B</text>
  <text x="48" y="213" class="caption" font-size="10.5">Steered</text>

  <rect x="132" y="178" width="188" height="36" class="same-pill"/>
  <text x="150" y="201" class="pill-txt same-txt">A watchmaker at a bench</text>

  <rect x="348" y="176" width="258" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="368" y="201" class="pill-txt" fill="#c2410c" font-weight="600">in blistering desert glare</text>

  <rect x="634" y="178" width="236" height="36" class="same-pill"/>
  <text x="652" y="201" class="pill-txt same-txt">adjusts a tiny brass gear.</text>

  <!-- Labels Under Ignored vs Pooled -->
  <text x="176" y="229" class="caption" font-size="10.5">Identical · Ignored</text>
  <text x="700" y="229" class="caption" font-size="10.5">Identical · Ignored</text>

  <!-- Arrow Down to Comparison Footer -->
  <line x1="477" y1="228" x2="477" y2="256" stroke="#0d9488" stroke-width="2" class="flow-line" marker-end="url(#arrTeal2)"/>

  <!-- Bottom Signal Comparison Card -->
  <rect x="28" y="260" width="864" height="64" class="card"/>

  <!-- Left: Surgical diff_span -->
  <text x="48" y="286" class="row-lbl" fill="#0f766e">diff_span (Default)</text>
  <rect x="196" y="273" width="240" height="16" rx="8" fill="#0d9488"/>
  <text x="196" y="308" class="caption" fill="#0f766e" font-weight="600">3× stronger signal · zero shared-word dilution</text>

  <!-- Divider -->
  <line x1="488" y1="272" x2="488" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right: Full-prompt averaging -->
  <text x="516" y="286" class="row-lbl" fill="#64748b">Full-Prompt Average</text>
  <rect x="676" y="273" width="184" height="16" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="676" y="273" width="52" height="16" rx="8" fill="#94a3b8"/>
  <text x="676" y="308" class="caption">Diluted across ~200 unchanged words</text>
</svg>
