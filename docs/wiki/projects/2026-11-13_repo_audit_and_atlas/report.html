  function statusBadge(st) {
    if (st === "active" || st === "shipped") return "b-active";
    if (st === "parked_closed") return "b-parked";
    if (st.startsWith("open")) return "b-open";
    if (st.startsWith("repaired")) return "b-repaired";
    return "b-queued";
  }

  function copyPath(txt, btn) {
    navigator.clipboard?.writeText(txt).then(() => {
      const prev = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => btn.textContent = prev, 1000);
    });
  }
  window.__atlasCopy = copyPath;

  function renderIdeas() {
    const tracks = ["all", ...new Set(data.unfinished_and_forgotten_ideas.map(i => i.track))];
    const filterHtml = `<div class="filters">
      <span class="meta">Track filter:</span>
      ${tracks.map(t => `<button class="pill ${trackFilter === t ? "active" : ""}" data-track="${t}">${esc(t)}</button>`).join("")}
    </div>`;
    const items = data.unfinished_and_forgotten_ideas.filter(i =>
      (trackFilter === "all" || i.track === trackFilter) && matchQ(i)
    );
    return filterHtml + `<div class="grid">` + items.map(i => `
      <article class="card">
        <div class="card-head">
          <h3>#${i.rank}. ${esc(i.title)}</h3>
          <span class="badge ${levBadge(i.leverage)}">${esc(i.leverage)}</span>
        </div>
        <div class="meta">Track: <code>${esc(i.track)}</code> · Effort: <code>${esc(i.effort)}</code> · Status: <code>${esc(i.status)}</code></div>
        <div><strong>Why it dropped:</strong> ${esc(i.why_it_dropped)}</div>
        <div><strong>Next step:</strong> ${esc(i.next_action)}</div>
        <div class="chips">
          ${i.code_anchors.map(a => `<span class="chip">${esc(a)}</span>`).join("")}
          ${i.source_sessions.map(s => `<span class="chip">${esc(s.slice(0,8))}</span>`).join("")}
        </div>
      </article>
    `).join("") + `</div>`;
  }

  function renderTracks() {
    const items = data.tracks.filter(matchQ);
    return `<div class="grid">` + items.map(t => `
      <article class="card">
        <div class="card-head">
          <h3>${esc(t.name)}</h3>
          <span class="badge ${statusBadge(t.status)}">${esc(t.status)}</span>
        </div>
        <div>${esc(t.summary)}</div>
        <div class="chips">${t.nodes.map(n => `<span class="chip">${esc(n)}</span>`).join("")}</div>
        <details>
          <summary>Files (${t.key_files.length}), Commits (${t.key_commits.length}), Workflows (${t.workflows.length}), Wiki (${t.wiki_owners.length})</summary>
          <p class="meta"><strong>Key files:</strong> ${t.key_files.map(f => `<code>${esc(f)}</code>`).join(" ")}</p>
          ${t.key_commits.length ? `<p class="meta"><strong>Commits:</strong> ${t.key_commits.map(c => `<code>${esc(c)}</code>`).join(" ")}</p>` : ""}
          ${t.workflows.length ? `<p class="meta"><strong>Workflows:</strong> ${t.workflows.map(w => `<code>${esc(w)}</code>`).join(" ")}</p>` : ""}
          <p class="meta"><strong>Wiki:</strong> ${t.wiki_owners.map(w => `<code>${esc(w)}</code>`).join(" ")}</p>
          ${t.renders.length ? `<p class="meta"><strong>Renders:</strong> ${t.renders.map(r => `<code>${esc(r)}</code>`).join(" ")}</p>` : ""}
        </details>
      </article>
    `).join("") + `</div>`;
  }

  function renderDiscrepancies() {
    const items = data.code_vs_prose_discrepancies.filter(matchQ);
    return `<table><thead><tr><th>Status</th><th>Area</th><th>Prose Claim</th><th>Code / Ground Truth</th><th>Resolution</th></tr></thead><tbody>` +
      items.map(d => `<tr>
        <td><span class="badge ${statusBadge(d.status)}">${esc(d.status)}</span></td>
        <td><strong>${esc(d.area)}</strong></td>
        <td>${esc(d.claim_in_prose)}</td>
        <td>${esc(d.ground_truth_in_code)}</td>
        <td>${esc(d.resolution)}</td>
      </tr>`).join("") + `</tbody></table>`;
  }

  function renderCatalogue() {
    const items = data.render_catalogue.filter(matchQ);
    return `<div class="grid">` + items.map(r => `
      <article class="card">
        <div class="card-head">
          <h3>${esc(r.batch)}</h3>
          <span class="badge b-active">${esc(r.date)}</span>
        </div>
        <div class="meta">Base folder: <code>${esc(r.dir)}</code></div>
        <div>${esc(r.finding)}</div>
        <div>${r.highlights.map(h => `
          <div style="margin:4px 0;"><code>${esc(h)}</code>
          <button class="copy-btn" type="button" onclick="window.__atlasCopy('${esc(h)}', this)">Copy</button></div>
        `).join("")}</div>
      </article>
    `).join("") + `</div>`;
  }

  function renderSessions() {
    const sa = data.sessions_audited;
    const agy = sa.agy_sessions.filter(matchQ);
    const cl = sa.claude_root_sessions.filter(matchQ);
    return `
      <h3>Antigravity (<code>agy</code>) Sessions Audited (${agy.length}/${sa.agy_sessions_count})</h3>
      <table><thead><tr><th>Session ID</th><th>Last Modified</th><th>Scope / Findings</th></tr></thead><tbody>
        ${agy.map(s => `<tr><td><code>${esc(s.id)}</code></td><td>${esc(s.last_mod)}</td><td>${esc(s.topic)}</td></tr>`).join("")}
      </tbody></table>
      <h3 style="margin-top:24px;">Claude Code Root Sessions Nov 10–13 (${cl.length}/${sa.claude_root_sessions_nov10_13_count} + ${sa.claude_subagent_transcripts_nov10_13_count} subagents)</h3>
      <table><thead><tr><th>Session ID</th><th>Title</th><th>Window</th><th>Scope / Outcome</th></tr></thead><tbody>
        ${cl.map(s => `<tr><td><code>${esc(s.id)}</code></td><td>${esc(s.title)}</td><td>${esc(s.window)}</td><td>${esc(s.topic)}</td></tr>`).join("")}
      </tbody></table>`;
  }

  function renderReorg() {
    const rb = data.reorg_blueprint;
    const locEntries = Object.entries(m.bench_python.by_location);
    const maxLoc = Math.max(...locEntries.map(([,v]) => v.lines));
    const bars = locEntries.map(([name, v]) => `
      <div class="bar-row">
        <code>${esc(name)}</code>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, Math.round(v.lines*100/maxLoc))}%"></div></div>
        <span class="meta">${v.files} .py · ${v.lines.toLocaleString()}L</span>
      </div>
    `).join("");
    return `
      <div class="grid">
        <article class="card">
          <h3>Phase 1: <code>docs/wiki/</code> Consolidation (Completed)</h3>
          <div>${esc(rb.phase_1_completed.summary)}</div>
        </article>
        <article class="card">
          <h3>Phase 2 Hard Invariants</h3>
          <ul>${rb.phase_2_proposed.hard_invariants.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        </article>
      </div>
      <article class="card" style="margin-top:14px;">
        <h3>Bench Python Distribution (Total: ${m.bench_python.total_files} files, ${m.bench_python.total_lines.toLocaleString()} LOC)</h3>
        ${bars}
      </article>
      <div class="grid" style="margin-top:14px;">
        <article class="card">
          <h3>Proposed Root Layout -> <code>${esc(rb.phase_2_proposed.root_package_plan.target)}</code></h3>
          <div class="meta">Keep at root: ${rb.phase_2_proposed.root_package_plan.keep_at_root.map(k => `<code>${esc(k)}</code>`).join(" ")}</div>
          ${rb.phase_2_proposed.root_package_plan.groups.map(g => `
            <div><code>${esc(g.pkg)}</code> -> ${g.modules.map(mod => `<code>${esc(mod)}</code>`).join(" ")}</div>
          `).join("")}
        </article>
        <article class="card">
          <h3>Proposed <code>bench/</code> Subpackage Grouping</h3>
          ${rb.phase_2_proposed.bench_package_plan.proposed_subdirs.map(d => `
            <div><code>${esc(d.dir)}</code> — ${esc(d.goal)}</div>
          `).join("")}
        </article>
      </div>`;
  }

  function render() {
    const panel = document.getElementById("panel");
    if (activeTab === "ideas") panel.innerHTML = renderIdeas();
    else if (activeTab === "tracks") panel.innerHTML = renderTracks();
    else if (activeTab === "discrepancies") panel.innerHTML = renderDiscrepancies();
    else if (activeTab === "renders") panel.innerHTML = renderCatalogue();
    else if (activeTab === "sessions") panel.innerHTML = renderSessions();
    else if (activeTab === "reorg") panel.innerHTML = renderReorg();

    panel.querySelectorAll(".pill[data-track]").forEach(btn => {
      btn.addEventListener("click", () => { trackFilter = btn.dataset.track; render(); });
    });
  }

  document.getElementById("tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (!b) return;
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    activeTab = b.dataset.tab;
    render();
  });

  document.getElementById("searchBox").addEventListener("input", (e) => {
    query = e.target.value.trim().toLowerCase();
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault();
      document.getElementById("searchBox").focus();
    }
  });
  document.getElementById("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });

  render();
})();
</script>
</body>
</html>
