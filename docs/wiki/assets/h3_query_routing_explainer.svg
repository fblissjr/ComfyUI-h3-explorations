<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%" role="img" aria-label="Stock H3 vs 1x Cross-Modal Query Routing">
  <defs>
    <filter id="qrShadow1" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#qrShadow1); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 20px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #52525b; }
    .band-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
    .title-sm { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; }
    .body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.2px; fill: #334155; }
    .muted { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; fill: #64748b; }
    .badge { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Outer Canvas -->
  <rect x="4" y="4" width="972" height="552" rx="16" class="canvas"/>

  <!-- Header -->
  <text x="30" y="36" class="heading">1x Cross-Modal Query Routing: Split Camera &amp; Mic Inside One Render</text>
  <text x="30" y="56" class="subhead">Give video and audio different instructions (or block visual-to-audio leakage) in a single pass — zero second pass, zero training.</text>

  <!-- BAND 1: LEFT (STOCK H3) -->
  <rect x="24" y="72" width="440" height="296" rx="12" class="card"/>
  <rect x="40" y="88" width="122" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="101" y="103" text-anchor="middle" fill="#b91c1c" class="badge">STOCK MINIMAX H3</text>
  <text x="174" y="103" class="band-title">One Shared Prompt Bleeds Everywhere</text>

  <!-- Shared Prompt Box -->
  <rect x="44" y="124" width="400" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="244" y="146" text-anchor="middle" class="title-sm" fill="#1e293b">Single Text Prompt + Shared Attention Sequence</text>
  <text x="244" y="165" text-anchor="middle" class="muted">Dialogue + Visuals + Soundscape all mix across 50 blocks</text>

  <!-- Arrows down with leaks -->
  <line x1="140" y1="178" x2="140" y2="216" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="348" y1="178" x2="348" y2="216" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <!-- Cross leak arrows -->
  <line x1="205" y1="248" x2="283" y2="248" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>
  <line x1="283" y1="264" x2="205" y2="264" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>

  <!-- Camera & Mic result boxes -->
  <rect x="44" y="220" width="158" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="123" y="241" text-anchor="middle" class="title-sm" fill="#991b1b">Video Stream</text>
  <text x="123" y="258" text-anchor="middle" class="body">Camera &amp; Actors</text>
  <text x="123" y="274" text-anchor="middle" class="muted">Mutated by sound/dub words</text>

  <rect x="286" y="220" width="158" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="365" y="241" text-anchor="middle" class="title-sm" fill="#991b1b">Audio Stream</text>
  <text x="365" y="258" text-anchor="middle" class="body">Voices &amp; Sound</text>
  <text x="365" y="274" text-anchor="middle" class="muted">Overruled by visual physics</text>

  <!-- Leak Examples Box -->
  <rect x="44" y="294" width="400" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="58" y="313" class="body"><tspan font-weight="700" fill="#c2410c">• "Zen tea pavilion"</tspan> tears garden windows into a brick studio.</text>
  <text x="58" y="330" class="body"><tspan font-weight="700" fill="#c2410c">• [Japanese] lines</tspan> recast actors and erase props.</text>
  <text x="58" y="347" class="body"><tspan font-weight="700" fill="#c2410c">• Blazing fire / giant biker</tspan> overpowers quiet/high-voice audio.</text>

  <!-- BAND 1: RIGHT (1x QUERY ROUTER) -->
  <rect x="480" y="72" width="476" height="296" rx="12" class="card"/>
  <rect x="496" y="88" width="142" height="22" rx="11" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="567" y="103" text-anchor="middle" fill="#4338ca" class="badge">1x QUERY ROUTING</text>
  <text x="650" y="103" class="band-title">Independent Camera &amp; Mic Routing</text>

  <!-- Prompt A & Prompt B -->
  <rect x="500" y="124" width="204" height="54" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="602" y="145" text-anchor="middle" class="title-sm" fill="#3730a3">Prompt A — Camera</text>
  <text x="602" y="164" text-anchor="middle" class="body">Sets, cast, props, action</text>

  <rect x="732" y="124" width="204" height="54" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="834" y="145" text-anchor="middle" class="title-sm" fill="#5b21b6">Prompt B — Microphone</text>
  <text x="834" y="164" text-anchor="middle" class="body">Language, voice tone, ambience</text>

  <!-- Arrows down cleanly -->
  <line x1="602" y1="178" x2="602" y2="216" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrIndigo)"/>
  <line x1="834" y1="178" x2="834" y2="216" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrPurple)"/>

  <!-- Video & Audio Query Boxes -->
  <rect x="500" y="220" width="166" height="62" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="583" y="241" text-anchor="middle" class="title-sm" fill="#3730a3">Video Queries (Q_vid)</text>
  <text x="583" y="258" text-anchor="middle" class="body">Reads only Prompt A</text>
  <text x="583" y="274" text-anchor="middle" class="muted">Cast &amp; geometry stay locked</text>

  <rect x="770" y="220" width="166" height="62" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="853" y="241" text-anchor="middle" class="title-sm" fill="#5b21b6">Audio Queries (Q_aud)</text>
  <text x="853" y="258" text-anchor="middle" class="body">Reads Prompt B (side-SDPA)</text>
  <text x="853" y="274" text-anchor="middle" class="muted">1-3% of tokens: 1x speed</text>

  <!-- Middle firewall vs lip-sync bridge -->
  <line x1="668" y1="238" x2="766" y2="238" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrTeal)"/>
  <text x="718" y="232" text-anchor="middle" class="badge" fill="#0f766e">LIP-SYNC OPEN</text>

  <rect x="676" y="253" width="84" height="24" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
  <text x="718" y="269" text-anchor="middle" class="badge" fill="#c2410c">gain = 0.0</text>
  <text x="718" y="290" text-anchor="middle" class="muted">Blocks Sight → Sound</text>

  <!-- Wins strip -->
  <rect x="500" y="302" width="436" height="52" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="514" y="322" class="body"><tspan font-weight="700" fill="#166534">✓ Unchanged cost:</tspan> Same single 1x denoising pass, zero extra LoRA/vector files.</text>
  <text x="514" y="341" class="body"><tspan font-weight="700" fill="#166534">✓ Optional Firewall:</tspan> Set <tspan class="mono">aud_to_vid_gain = 0.0</tspan> when visuals overpower audio.</text>

  <!-- BAND 2: THREE MODES -->
  <text x="30" y="394" class="band-title">Three Practical Modes Inside MiniMaxH3QueryRouter</text>

  <!-- Mode 1 -->
  <rect x="24" y="406" width="298" height="132" rx="12" class="card"/>
  <rect x="40" y="420" width="136" height="20" rx="10" fill="#4f46e5"/>
  <text x="108" y="434" text-anchor="middle" fill="#ffffff" class="badge">1. DUAL-PROMPT SPLIT</text>
  <text x="40" y="460" class="title-sm" fill="#1e293b">Dubbing &amp; Soundscape Swaps</text>
  <text x="40" y="479" class="body">Keep Camera Prompt A intact and rewrite</text>
  <text x="40" y="495" class="body">only audio lines or ambience in Prompt B.</text>
  <text x="40" y="518" class="mono" fill="#4338ca">aud_to_vid_gain = 1.0 | band = all</text>

  <!-- Mode 2 -->
  <rect x="340" y="406" width="300" height="132" rx="12" class="card"/>
  <rect x="356" y="420" width="160" height="20" rx="10" fill="#d97706"/>
  <text x="436" y="434" text-anchor="middle" fill="#ffffff" class="badge">2. SIGHT → SOUND FIREWALL</text>
  <text x="356" y="460" class="title-sm" fill="#1e293b">Mute Fire, Swap Voices, Dry Redub</text>
  <text x="356" y="479" class="body">Blocks visual-to-audio attention (direct +</text>
  <text x="356" y="495" class="body">1-hop text relay) while keeping lip-sync open.</text>
  <text x="356" y="518" class="mono" fill="#b45309">aud_to_vid_gain = 0.0 (clean Prompt B)</text>

  <!-- Mode 3 -->
  <rect x="658" y="406" width="298" height="132" rx="12" class="card"/>
  <rect x="674" y="420" width="150" height="20" rx="10" fill="#7c3aed"/>
  <text x="749" y="434" text-anchor="middle" fill="#ffffff" class="badge">3. BINAURAL L/R SPLIT</text>
  <text x="674" y="460" class="title-sm" fill="#1e293b">Two Acoustic Worlds in Stereo</text>
  <text x="674" y="479" class="body">Share early blocks (0..29) so speech aligns,</text>
  <text x="674" y="495" class="body">then split Right ear acoustics in blocks 30..49.</text>
  <text x="674" y="518" class="mono" fill="#6d28d9">channel = right | band = late_30_49</text>
</svg>
