<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%" role="img" aria-label="Measured Sight-to-Sound Firewall Gains">
  <defs>
    <filter id="qrShadow2" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#qrShadow2); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 19.5px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #52525b; }
    .band-title { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 14.5px; font-weight: 700; fill: #1e293b; }
    .label { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.2px; font-weight: 600; fill: #334155; }
    .metric { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; }
    .body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #475569; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
  </style>

  <rect x="4" y="4" width="972" height="412" rx="16" class="canvas"/>
  <text x="28" y="36" class="heading">What Closing the Sight-to-Sound Firewall (aud_to_vid_gain = 0.0) Actually Changes</text>
  <text x="28" y="55" class="subhead">Measured same-seed comparisons across voice pitch casting, fire muting, underwater speech, and frozen-video re-dubbing.</text>

  <!-- LEFT CARD: BIKER PITCH CURVE -->
  <rect x="24" y="72" width="462" height="322" rx="12" class="card"/>
  <text x="44" y="100" class="band-title">Wrong-Voice Casting: Biker + Squeaky Grandma Prompt</text>
  <text x="44" y="118" class="body">Visual close-up of a 6'5" biker keeps pulling pitch down until aud_to_vid_gain closes.</text>

  <!-- Bar 1: Plain -->
  <text x="44" y="156" class="label">Plain H3 (No Router)</text>
  <rect x="176" y="140" width="136" height="24" rx="5" fill="#fecaca" stroke="#ef4444"/>
  <text x="320" y="157" class="mono" fill="#b91c1c">168.7 Hz (male)</text>

  <!-- Bar 2: gain=1.0 -->
  <text x="44" y="204" class="label">Router (gain = 1.0)</text>
  <rect x="176" y="188" width="164" height="24" rx="5" fill="#fed7aa" stroke="#f97316"/>
  <text x="348" y="205" class="mono" fill="#c2410c">187.4 Hz (+1.8 st)</text>

  <!-- Bar 3: gain=0.15 -->
  <text x="44" y="252" class="label">Router (gain = 0.15)</text>
  <rect x="176" y="236" width="212" height="24" rx="5" fill="#ddd6fe" stroke="#8b5cf6"/>
  <text x="186" y="252" class="mono" fill="#4c1d95">216.9 Hz (+4.4 st)</text>

  <!-- Bar 4: gain=0.0 -->
  <text x="44" y="300" class="label">Router (gain = 0.0)</text>
  <rect x="176" y="284" width="286" height="24" rx="5" fill="#4f46e5"/>
  <text x="186" y="300" class="mono" fill="#ffffff">260.2 Hz (+7.5 st, synced lips)</text>

  <rect x="44" y="330" width="422" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="58" y="349" class="body"><tspan font-weight="700" fill="#3730a3">Result:</tspan> Smooth, monotonic +7.5 semitone voice shift across all 3 shots</text>
  <text x="58" y="365" class="body">while keeping Video → Audio open so every word stays tightly lip-synced.</text>

  <!-- RIGHT CARD: ACOUSTIC ISOLATION -->
  <rect x="502" y="72" width="454" height="322" rx="12" class="card"/>
  <text x="522" y="100" class="band-title">Breaking Visual-Physics Dominance in Audio</text>
  <text x="522" y="118" class="body">Same visual pixels, dramatic acoustic separation when Camera → Mic is blocked.</text>

  <!-- Subcard 1: Shellshock -->
  <rect x="522" y="134" width="414" height="76" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="538" y="155" class="label">Shell-Shock World-Mute (Blazing Warehouse Fire)</text>
  <text x="538" y="179" class="metric" fill="#c2410c">-32.7 dB quieter</text>
  <text x="720" y="177" class="mono" fill="#9a3412">55x less crackle (&gt; 2 kHz)</text>
  <text x="538" y="198" class="body">-23.1 dBFS roar (gain=1.0) → -55.8 dBFS stillness (gain=0.0); flames intact.</text>

  <!-- Subcard 2: Frozen Video Dry Redub -->
  <rect x="522" y="220" width="414" height="76" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="538" y="241" class="label">Pixel-Locked Underwater Dry Redub (AudioRefineMask)</text>
  <text x="538" y="265" class="metric" fill="#0f766e">5.8x less hiss</text>
  <text x="720" y="263" class="mono" fill="#115e59">+39% voiced speech, 26s faster</text>
  <text x="538" y="284" class="body">Identical source pixels (2.34 MAE) with clean dry stairwell speech swapped in.</text>

  <!-- Subcard 3: UW Dry Speech -->
  <rect x="522" y="306" width="414" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="538" y="327" class="label">Underwater Video + Dry Speech (T2V Generation)</text>
  <text x="538" y="351" class="metric" fill="#4338ca">+9.4 dB louder speech</text>
  <text x="748" y="349" class="mono" fill="#3730a3">-32.3 → -22.9 dBFS</text>
  <text x="538" y="368" class="body">Close-mic dry dialogue over rising silver bubbles and turquoise water caustics.</text>
</svg>
