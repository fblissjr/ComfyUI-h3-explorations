<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 444" width="100%" height="100%" role="img" aria-label="How Zero-Rewrite HUD Portal Videos and Auto Self-Mask EditGuider Bridges Work in MiniMax H3">
  <defs>
    <filter id="cardShadowHud" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrTealH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrAmberH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrIndigoH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#cardShadowHud); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 20px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #52525b; }
    .title { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; }
    .body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.8px; fill: #334155; }
    .muted { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.2px; fill: #64748b; }
    .eq { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.2px; font-weight: 700; }
    .badge { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.8px; font-weight: 700; }
  </style>

  <!-- Outer Canvas -->
  <rect x="4" y="4" width="972" height="436" rx="16" class="canvas"/>

  <!-- Header -->
  <text x="28" y="36" class="heading">How 2× Moving Portals &amp; Auto Self-Mask EditGuider Work</text>
  <text x="28" y="55" class="subhead">One untouched prompt (or surgical edit) feeds two branches: a moving [F,H,W] mask or Step-0 SelfMask paints strictly inside mask = 1.</text>

  <!-- Left Column: Untouched Prompt -->
  <rect x="24" y="74" width="194" height="190" rx="12" class="card"/>
  <rect x="36" y="86" width="124" height="20" rx="10" fill="#475569"/>
  <text x="98" y="100" text-anchor="middle" fill="#ffffff" class="badge">1. BASE / EDIT</text>
  <text x="36" y="126" class="title" fill="#1e293b">Zero-Rewrite or Surgical</text>
  <text x="36" y="144" class="body">• Same prompt + vector</text>
  <text x="44" y="159" class="muted">(same_prompt = True)</text>
  <text x="36" y="178" class="body">• Or surgical prompt edit</text>
  <text x="44" y="193" class="muted">(e.g. right speaker →</text>
  <text x="44" y="207" class="muted">sapphire android, tb1)</text>
  <text x="36" y="228" class="body">• Lock music via</text>
  <text x="44" y="243" class="muted">FreezeAudio + video_only</text>

  <!-- Branch arrows from Prompt -->
  <path d="M 220 132 L 254 114" stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#arrTealH)"/>
  <path d="M 220 186 L 254 204" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arrAmberH)"/>

  <!-- Middle Top: Branch A (Original) -->
  <rect x="260" y="74" width="268" height="78" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <rect x="272" y="84" width="142" height="20" rx="10" fill="#0d9488"/>
  <text x="343" y="98" text-anchor="middle" fill="#ffffff" class="badge">BRANCH A: ORIGINAL</text>
  <text x="272" y="121" class="body"><tspan font-weight="700" fill="#115e59">Outside the mask (mask = 0):</tspan></text>
  <text x="272" y="137" class="body">Unsteered base world (or World A take).</text>

  <!-- Middle Bottom: Branch B (Edited + Erasure) -->
  <rect x="260" y="164" width="268" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/>
  <rect x="272" y="174" width="214" height="20" rx="10" fill="#d97706"/>
  <text x="379" y="188" text-anchor="middle" fill="#ffffff" class="badge">BRANCH B: EDITED (edited_only)</text>
  <text x="272" y="210" class="body"><tspan font-weight="700" fill="#92400e">Equation 1 — Clear Baseline + Target:</tspan></text>
  <text x="272" y="229" class="eq" fill="#b45309">H' = H − Clear(Pole A) + s · Target</text>
  <text x="272" y="248" class="muted">Or surgical prompt rewrite inside the mask.</text>

  <!-- Bottom Left-Middle: Spatial Director OR SelfMaskRouter -->
  <rect x="24" y="278" width="504" height="142" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="38" y="290" width="280" height="20" rx="10" fill="#4f46e5"/>
  <text x="178" y="304" text-anchor="middle" fill="#ffffff" class="badge">2. MOVING PORTAL OR AUTO SELF-MASK [F, H, W]</text>
  <text x="38" y="328" class="title" fill="#312e81">SpatialDirector · SAM 3.1 · or Zero-Mask MiniMaxH3SelfMaskRouter</text>
  <text x="38" y="346" class="body">• <tspan font-weight="700">Painted / SAM / Director:</tspan> Smooth moving circles, ellipses, or wipes (zero 32×32 stair-step).</text>
  <text x="38" y="363" class="body">• <tspan font-weight="700">NEW Auto Self-Mask Bridge (tb1):</tspan> Leave <tspan font-weight="700">.mask</tspan> unwired — EditGuider pulls Step-0</text>
  <text x="46" y="378" class="body"><tspan font-weight="700">right_speaker</tspan> / noun harvest automatically (<tspan font-weight="700" fill="#4338ca">1.782× in/out MAE, 0 SAM / 0 boxes</tspan>).</text>
  <text x="38" y="399" class="muted"><tspan font-weight="700" fill="#3730a3">Small-mask tip:</tspan> Use 1× <tspan font-weight="700">SpatialQR (*_shield)</tspan> or SelfMask→2× EditGuider (last_step=3).</text>

  <!-- Arrows into Guider Box -->
  <path d="M 530 115 L 566 155" stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#arrTealH)"/>
  <path d="M 530 212 L 566 196" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arrAmberH)"/>
  <path d="M 530 340 L 566 250" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrIndigoH)"/>

  <!-- Right Column: EditGuider Blend + Outputs -->
  <rect x="572" y="74" width="384" height="202" rx="12" class="card"/>
  <rect x="586" y="86" width="212" height="20" rx="10" fill="#1e293b"/>
  <text x="692" y="100" text-anchor="middle" fill="#ffffff" class="badge">3. PER-TOKEN VELOCITY BLEND</text>
  <text x="586" y="126" class="title" fill="#0f172a">MiniMaxH3EditGuider (Equation 2)</text>

  <rect x="586" y="138" width="356" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="764" y="161" text-anchor="middle" class="eq" fill="#0f172a">v_out = orig + (scale × mask) × (edit − orig)</text>

  <text x="586" y="194" class="body">• <tspan font-weight="700" fill="#0d9488">mask = 0 (outside):</tspan> stays 100% original take (zero leak).</text>
  <text x="586" y="211" class="body">• <tspan font-weight="700" fill="#d97706">mask = 1 (inside):</tspan> moves <tspan font-weight="700">scale×</tspan> into the edited world.</text>
  <text x="586" y="228" class="body">• <tspan font-weight="700" fill="#4f46e5">Audio Guard:</tspan> <tspan font-weight="700">video_only</tspan> (locks voice/song), <tspan font-weight="700">both</tspan>,</text>
  <text x="594" y="244" class="body">or independent <tspan font-weight="700">audio_scale</tspan> (first_step=1, last_step=3).</text>
  <text x="586" y="262" class="muted">Sequential B=1 execution avoids VRAM OOM at 1344×768.</text>

  <!-- Arrow down to Dual Outputs -->
  <line x1="764" y1="278" x2="764" y2="300" stroke="#475569" stroke-width="1.8" marker-end="url(#arrDark)"/>

  <!-- Bottom Right: Clean + HUD Outputs -->
  <rect x="572" y="306" width="384" height="114" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="586" y="318" width="218" height="20" rx="10" fill="#0f766e"/>
  <text x="695" y="332" text-anchor="middle" fill="#ffffff" class="badge">4. DUAL CLEAN + HUD EXPORTS</text>
  <text x="586" y="356" class="body">• <tspan font-weight="700">Clean MP4:</tspan> Pure split-world video + synced 40 Hz audio.</text>
  <text x="586" y="373" class="body">• <tspan font-weight="700">MiniMaxH3DirectorHUD MP4:</tspan> Live cyan reticle, frame</text>
  <text x="594" y="389" class="body">telemetry, and A|B In-Mask vs Out-Mask MAE overlay.</text>
  <text x="586" y="408" class="muted">Shipped: audio_freeze_spatial_portal &amp; self_mask_speaker_edit_guider</text>
</svg>
