<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%" role="img" aria-label="How Zero-Rewrite HUD Portal Videos Work in MiniMax H3: Two Simple Equations">
  <defs>
    <filter id="cardShadowHud" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrTealH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrAmberH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrIndigoH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <style>
    .canvas { fill: #faf9f5; stroke: #e5e3dc; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#cardShadowHud); }
    .heading { font-family: Georgia, "Newsreader", "Charter", serif; font-size: 20px; font-weight: 700; fill: #18181b; }
    .subhead { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #52525b; }
    .title { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; }
    .body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #334155; }
    .muted { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10.5px; fill: #64748b; }
    .eq { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; }
    .badge { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Outer Canvas -->
  <rect x="4" y="4" width="972" height="422" rx="16" class="canvas"/>

  <!-- Header -->
  <text x="30" y="36" class="heading">How Zero-Rewrite HUD Portal Videos Work (Two Simple Equations)</text>
  <text x="30" y="56" class="subhead">One untouched prompt feeds two branches: a moving [F, H, W] portal mask paints a cleared+boosted world strictly inside mask = 1</text>

  <!-- Left Column: Untouched Prompt -->
  <rect x="24" y="76" width="194" height="172" rx="12" class="card"/>
  <rect x="36" y="88" width="124" height="20" rx="10" fill="#475569"/>
  <text x="98" y="102" text-anchor="middle" fill="#ffffff" class="badge">1. SAME PROMPT</text>
  <text x="36" y="128" class="title" fill="#1e293b">Zero Prompt Rewrites</text>
  <text x="36" y="146" class="body">Exact same scene prompt</text>
  <text x="36" y="161" class="body">feeds BOTH branches</text>
  <text x="36" y="176" class="body">(<tspan font-weight="700">same_prompt = True</tspan>).</text>
  <text x="36" y="198" class="muted">Example: "DISCO ROLLERLAND"</text>
  <text x="36" y="213" class="muted">or stairwell dialogue —</text>
  <text x="36" y="228" class="muted">not a single word edited.</text>

  <!-- Branch arrows from Prompt -->
  <path d="M 220 132 L 254 114" stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#arrTealH)"/>
  <path d="M 220 186 L 254 204" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arrAmberH)"/>

  <!-- Middle Top: Branch A (Original) -->
  <rect x="260" y="76" width="268" height="78" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <rect x="272" y="86" width="142" height="20" rx="10" fill="#0d9488"/>
  <text x="343" y="100" text-anchor="middle" fill="#ffffff" class="badge">BRANCH A: ORIGINAL</text>
  <text x="272" y="123" class="body"><tspan font-weight="700" fill="#115e59">Outside the portal (mask = 0):</tspan></text>
  <text x="272" y="139" class="body">Unsteered base world (or World A vector).</text>

  <!-- Middle Bottom: Branch B (Edited + Erasure) -->
  <rect x="260" y="166" width="268" height="104" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/>
  <rect x="272" y="176" width="214" height="20" rx="10" fill="#d97706"/>
  <text x="379" y="190" text-anchor="middle" fill="#ffffff" class="badge">BRANCH B: EDITED (edited_only)</text>
  <text x="272" y="213" class="body"><tspan font-weight="700" fill="#92400e">Equation 1 — Clear Baseline + Boost Target:</tspan></text>
  <text x="272" y="232" class="eq" fill="#b45309">H' = H − Clear(Pole A) + s · Target</text>
  <text x="272" y="252" class="muted">Breaks the Prompt Veto inside the portal (5.91× wipe!).</text>

  <!-- Bottom Left-Middle: Spatial Director Mask -->
  <rect x="24" y="282" width="504" height="122" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="38" y="294" width="192" height="20" rx="10" fill="#4f46e5"/>
  <text x="134" y="308" text-anchor="middle" fill="#ffffff" class="badge">2. MOVING PORTAL MASK [F, H, W]</text>
  <text x="38" y="332" class="title" fill="#312e81">MiniMaxH3SpatialDirector → Causal [1, 4, 4, 4, 4] + 40 Hz Audio Pool</text>
  <text x="38" y="350" class="body">• Rasterizes moving/expanding circles, ellipses, or vertical wipes across every frame (0 → 1).</text>
  <text x="38" y="366" class="body">• Pools onto H3's exact video latent grid + projects a per-frame envelope onto 40 Hz audio.</text>
  <text x="38" y="383" class="muted"><tspan font-weight="700" fill="#3730a3">Continuity rule:</tspan> Footprints ≥ 30% beat 50-block global attention (tiny ~10% circles wash out).</text>

  <!-- Arrows into Guider Box -->
  <path d="M 530 115 L 566 155" stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#arrTealH)"/>
  <path d="M 530 212 L 566 196" stroke="#d97706" stroke-width="1.8" fill="none" marker-end="url(#arrAmberH)"/>
  <path d="M 530 330 L 566 250" stroke="#4f46e5" stroke-width="1.8" fill="none" marker-end="url(#arrIndigoH)"/>

  <!-- Right Column: EditGuider Blend + Outputs -->
  <rect x="572" y="76" width="384" height="196" rx="12" class="card"/>
  <rect x="586" y="88" width="212" height="20" rx="10" fill="#1e293b"/>
  <text x="692" y="102" text-anchor="middle" fill="#ffffff" class="badge">3. PER-TOKEN VELOCITY BLEND</text>
  <text x="586" y="128" class="title" fill="#0f172a">MiniMaxH3EditGuider (Equation 2)</text>

  <rect x="586" y="140" width="356" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="764" y="163" text-anchor="middle" class="eq" fill="#0f172a">v_out = orig + (scale × mask) × (edit − orig)</text>

  <text x="586" y="196" class="body">• <tspan font-weight="700" fill="#0d9488">mask = 0 (outside):</tspan> stays 100% original take (zero leak).</text>
  <text x="586" y="213" class="body">• <tspan font-weight="700" fill="#d97706">mask = 1 (inside):</tspan> moves <tspan font-weight="700">scale×</tspan> into the steered world.</text>
  <text x="586" y="230" class="body">• <tspan font-weight="700" fill="#4f46e5">Audio Guard:</tspan> choose <tspan font-weight="700">video_only</tspan> (lock voice), <tspan font-weight="700">both</tspan></text>
  <text x="594" y="246" class="body">(pulse audio with portal), or <tspan font-weight="700">independent</tspan> audio scale.</text>
  <text x="586" y="262" class="muted">Zero extra passes beyond 2×; sequential B=1 prevents OOM.</text>

  <!-- Arrow down to Dual Outputs -->
  <line x1="764" y1="274" x2="764" y2="296" stroke="#475569" stroke-width="1.8" marker-end="url(#arrDark)"/>

  <!-- Bottom Right: Clean + HUD Outputs -->
  <rect x="572" y="302" width="384" height="102" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="586" y="314" width="218" height="20" rx="10" fill="#0f766e"/>
  <text x="695" y="328" text-anchor="middle" fill="#ffffff" class="badge">4. DUAL CLEAN + HUD EXPORTS</text>
  <text x="586" y="352" class="body">• <tspan font-weight="700">Clean MP4:</tspan> Pure split-world video + synced 40 Hz audio.</text>
  <text x="586" y="369" class="body">• <tspan font-weight="700">MiniMaxH3DirectorHUD MP4:</tspan> Stamps live cyan reticle,</text>
  <text x="594" y="385" class="body">frame/progress telemetry, and A|B In-Mask vs Out-Mask MAE.</text>
</svg>
