[vector]
name = "env_torrential_rain_drench"
quality = "heavy pouring sheets of torrential rain saturating hair, plastering clothes to skin, and flooding stone in slick splashy streams against dry rainless baselines"
a_side = "diverse parched cloudless sunshine, calm arid dusk, dry frosty breezes, warm summer stillness, and rainless starlight clarity"
b_side = "heavy pouring sheets of torrential deluge saturating wet hair, plastering soaked collars flat, and streaming puddles across slick stone"
mode = "t2va"
frame = "scene"
exclude_shots = ["t2va_offpath_tortoise", "ref2va_look_anchor"]
# tier = Tier 2 — Atmosphere & Surface Physics
# inference_recipe = target=scene_only (fl2va, start=0.17, end=0.83) / description_only (ref2va), strength=1.2..1.6, release_refs=1.0

[routing]
bus = "look"
regime = "a"
target = "scene_only"
streams = "both"
block_band = "all"
needs_ref_release = false
families = ["fl2va", "ref2va", "h3_image"]
default_strength = 1

