[vector]
name = "noir"
quality = "high-contrast black-and-white 35mm film noir against natural colour"
a_side = "natural colour with balanced daylight or tungsten tones and open shadow detail"
b_side = "high-contrast black-and-white 35mm film noir with deep inky shadows, stark silver-grey highlights, and fine silver grain"
mode = "t2va"
frame = "scene"
exclude_shots = ["t2va_offpath_tortoise", "ref2va_look_anchor", "t2va_look_anchor", "t2va_look_noir", "t2va_spec_specific"]
